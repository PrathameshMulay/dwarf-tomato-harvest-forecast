# Demo customer profiles (owner: L04). SPEC D2.
# Three FICTIONAL customers, each "owning" two of the six real rooms of the
# 4th Autonomous Greenhouse Challenge. Names are invented; no real company,
# person or logo. The app shows "Demo customer — replayed 2024 data" on every screen.
#
# Rooms are paired so that on the default "today" (6 Nov 2024) each customer has one
# room that was harvested early and one that was harvested late, which shows
# different statuses side by side.
#
# area_m2: the room area used to turn € per m² into € per room. Every room in the
# challenge is the same compartment, so all six use the same value; it must match
# economics.area_m2 in config/crop.yaml (L05 confirms the compartment size).
customers:
  - customer_id: c1
    name: Willowmere Greenhouses
    tagline: Family-run pot-tomato grower, two glasshouse rooms
    rooms:
      - room: mugrow
        display_name: House 1 · North
        area_m2: 96.0
      - room: trigger
        display_name: House 2 · South
        area_m2: 96.0
  - customer_id: c2
    name: Bramblecote Growers
    tagline: Garden-centre supplier, two trial rooms for dwarf tomato
    rooms:
      - room: ideas
        display_name: Bay A
        area_m2: 96.0
      - room: agrifusion
        display_name: Bay B
        area_m2: 96.0
  - customer_id: c3
    name: Fennick Hollow Produce
    tagline: Co-op of small growers sharing two lit rooms
    rooms:
      - room: reference
        display_name: Room East
        area_m2: 96.0
      - room: tomatonuts
        display_name: Room West
        area_m2: 96.0
