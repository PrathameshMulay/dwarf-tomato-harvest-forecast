# Crop settings for the Tomato Harvest POC (owner: lane L05).
# Every value has a comment naming its source. The full table, with "what changes if it is wrong",
# is docs/assumptions.md; the `assumptions:` list at the end is the machine-readable copy that
# publish.py turns into app/data/assumptions.json.
#
# "Paper" = Maree et al. 2025, Sensors 25(14):4321, doi:10.3390/s25144321 (checked in a browser 14 Nov 2026).
# Keys match tests/fixtures/crop.yaml; values marked PROPOSED are G1 decisions.
#
# NOTE (D9 / L05 Blocked): two SPEC §5 values differ from the paper (price, re-spacing cost).
# The keys under `economics:` keep the SPEC values until the integrator decides; the paper's
# values are under `scoring_verified:` so L02 can switch with one line.

crop: dwarf tomato (potted, sold as whole pots)   # Paper §2.2: 'Pick-&-Joy Red Cherry', 13 cm pots
planted: 2024-09-03          # Paper §2.1: transplanting on 3 Sep 2024 (all rooms)
base_temp_c: 10.0            # Convention for tomato degree-days; matches main's gdd_cum (first day 22.7 °C -> 12.7). Not checked in a primary source.

ripeness:
  sample_weight: 0.7         # Team choice (SPEC §4): how far a crop sample pulls the curve; 0 = ignore, 1 = pass through it
  onset_red_index: 0.1       # main's forecast.py ONSET_MIN: % of photo that is red fruit, 3 days running = ripening started
  onset_days: 3              # main's photo-onset rule (SPEC §4)
  rate_days: 7               # Team choice (SPEC §4): future warmth per day = mean of the last N days
  plant_spread_sd: 12.5      # Data: pooled sd of % red across plants in the 5 Nov hand weighings (main, README)
  horizon_days: 21           # Team choice (SPEC §5): days ahead the harvest window looks

economics:
  sellable_red_share: 0.3333 # Paper §2.5 and §3.1: unsellable if under one third of fruit (by weight) is red. VERIFIED
  red_cap_g: 150.0           # Paper §3.1 and Fig. 3: red fruit above 150 g per pot adds nothing. VERIFIED
  price_eur_per_pot: 2.15    # SPEC §5 (main's back-out). Paper Fig. 3 says 1.80-2.00, see scoring_verified. UNDER REVIEW
  price_low: 1.75            # SPEC §5 stress test. UNDER REVIEW
  price_high: 2.50           # SPEC §5 stress test. UNDER REVIEW
  plant_cost_eur: 0.75       # Paper §2.5: seed, pot, soil and propagation, EUR 0.75 per pot. VERIFIED
  respacing_cost_eur_m2: 1.50  # SPEC §5 one-off charge. Paper §2.5: EUR 1.50 per m2 PER YEAR per step, see scoring_verified. UNDER REVIEW
  cost_rate_days: 7          # Team choice (SPEC §5): future daily cost = mean of the last 7 days of the room log
  earliest_sellable_share: 0.95   # PROPOSED (SPEC §5): "earliest sellable day" = this share of pots sellable
  harvest_now_share: 0.90         # PROPOSED: status harvest_now needs at least this share sellable today
  area_m2: 96.0                   # Paper §2.2: six equal compartments of 96 m2. VERIFIED

# What the paper actually says (Fig. 3, §2.5, Table 1). Not yet used by the model; see docs/assumptions.md §2.
scoring_verified:
  # Price per pot (before the EUR 0.75 plant cost) by red fruit weight per pot, read off Fig. 3 (about ±EUR 0.02).
  # Straight lines between points; zero below 50 g; flat above 150 g.
  # Low line applies at fruit dry matter <= 7 %, high line at >= 8 %, linear in between (Fig. 3 caption).
  price_curve_red_g: [50.0, 80.0, 150.0]
  price_curve_low_dm: [0.00, 1.60, 1.80]
  price_curve_high_dm: [0.00, 1.80, 2.00]
  price_eur_per_pot: 1.80    # full-value price at dry matter <= 7 % (4 of 6 rooms; dry matter is not in our data)
  price_low: 1.60            # stress test: EUR 0.20 below full value (our choice, not from the paper)
  price_high: 2.00           # full-value price at dry matter >= 8 %
  min_red_g: 50.0            # Paper §3.1: at least 50 g red fruit per pot, else no gains
  respacing_eur_m2_per_year: 1.50   # Paper §2.5: per spacing step, part of daily fixed costs
  fixed_eur_m2_per_year: 18.125     # Paper §2.5: maintenance and depreciation (about EUR 0.05/m2/day)
  lamp_eur_per_umol_year: 0.07      # Paper §2.5: lamp depreciation per µmol/(m2 s) installed, per year
  intervention_penalty_eur_pot: 0.10  # Paper §2.6: charged in the challenge, left out of the paper's results
  density_average: harmonic  # Table 1 "Avg. plant density" = 1 / mean(1/density); our data reproduces all six to 0.1 pots/m2

confidence:                  # PROPOSED thresholds (team choice, G1); level = worst of the three parts
  day_range_high_max: 4      # best-day range (days) at most this -> high
  day_range_medium_max: 8    # at most this -> medium, else low
  agree_points: 10           # camera / sample within this many points of the forecast -> agree
  conflict_points: 20        # more than this apart -> conflict, between -> mixed
  fresh_high_max: 3          # days since newest sample or usable photo at most this -> high
  fresh_medium_max: 7

alerts:                      # PROPOSED thresholds (team choice)
  schedule_points: 15        # sample or camera outside the band by more than this -> behind/ahead
  flatline_days: 3           # same reading this many days running -> sensor check
  drift_share: 0.15          # 7-day warmth rate this far below the other rooms' median -> drift

# Machine-readable assumption list for app/data/assumptions.json (contract: name, value, unit, source, if_wrong).
# `key` points at the setting above so the value is never typed twice.
assumptions:
  - name: Pot sells only if this share of its fruit is red
    key: economics.sellable_red_share
    unit: share of fruit weight
    source: Challenge rules, Maree et al. 2025 §2.5 (verified)
    if_wrong: Earliest sellable day moves; best day moves with it.
  - name: Red fruit counted up to
    key: economics.red_cap_g
    unit: g per pot
    source: Challenge rules, Maree et al. 2025 §3.1 and Fig. 3 (verified)
    if_wrong: A higher cap rewards waiting longer; best day would move later.
  - name: Price per pot at full value
    key: economics.price_eur_per_pot
    unit: EUR per pot
    source: Backed out from published profits (team estimate); paper's price chart shows EUR 1.80-2.00, under review
    if_wrong: Profit level changes; best day barely moves (tested EUR 1.75-2.50).
  - name: Plant cost
    key: economics.plant_cost_eur
    unit: EUR per pot
    source: Challenge rules, Maree et al. 2025 §2.5 (verified)
    if_wrong: Profit level shifts by the same amount per pot; best day does not move.
  - name: Re-spacing cost
    key: economics.respacing_cost_eur_m2
    unit: EUR per m2 per step
    source: Team reading of the rules; paper says EUR 1.50 per m2 per year per step, under review
    if_wrong: Spacing is done before harvest decisions, so profit level changes but best day barely moves.
  - name: Room area
    key: economics.area_m2
    unit: m2
    source: Maree et al. 2025 §2.2 (verified)
    if_wrong: Only euro totals per room change.
  - name: Base temperature for warmth (degree-days)
    key: base_temp_c
    unit: °C
    source: Common tomato convention; matches the team's derived tables
    if_wrong: Ripening speed per warm day shifts; the what-if slider is most affected.
  - name: Plant-to-plant spread in ripeness
    key: ripeness.plant_spread_sd
    unit: points of % red
    source: 5 Nov hand weighings, 6 plants per room (dataset)
    if_wrong: Wider spread delays the day 95% of pots are sellable.
  - name: Future warmth and cost per day
    key: ripeness.rate_days
    unit: days averaged
    source: Team choice (mean of the last 7 days)
    if_wrong: A cold or warm spell ahead moves the best day by a day or two.
  - name: Earliest sellable day needs this share of pots sellable
    key: economics.earliest_sellable_share
    unit: share of pots
    source: Team choice (proposed)
    if_wrong: A lower bar shows an earlier date.
